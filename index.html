<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>bp ombor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#030609;--panel:#0b1420;--panel2:#101d2c;--text:#eaf4ff;--muted:#8296ad;--blue:#168cff;--cyan:#36c6ff;--line:#1c3045;--green:#28d6a0;--red:#ff657e}
body.light{--bg:#edf5fc;--panel:#fff;--panel2:#e4eef8;--text:#132236;--muted:#60748b;--line:#cbdbea;--blue:#0879d8;--cyan:#0879d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 5% 0%,#0055b54a,transparent 34%),radial-gradient(ellipse at 100% 85%,#006bff38,transparent 30%),linear-gradient(135deg,transparent 0 70%,#008bff12 75%,transparent 80%)}
header{padding:22px 18px 14px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:28px;font-weight:300;font-style:italic;letter-spacing:-3px;color:var(--cyan);padding:4px 13px;border:1px solid #148cff70;border-radius:12px;box-shadow:0 0 22px #008cff24}.brand h1{font-size:18px;margin:0;letter-spacing:1.4px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:3px}.tools{display:flex;gap:7px}button,select,input{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:11px 13px;cursor:pointer}button.primary{background:linear-gradient(110deg,#0879e7,#20baff);color:white;border:0;font-weight:650}button:active{transform:scale(.98)}main{padding:0 14px 100px;max-width:850px;margin:auto}.hero{padding:18px;border:1px solid #1266a255;background:linear-gradient(125deg,#071a2b,#080c13 65%,#031d35);border-radius:20px;position:relative;overflow:hidden;margin-bottom:14px}.hero:after{content:"";position:absolute;width:200px;height:200px;border:1px solid #138eff44;border-radius:45%;right:-70px;top:-90px;transform:rotate(40deg);box-shadow:0 0 0 15px #087bff0c,0 0 0 35px #087bff08}.hero p{color:#8ca8c2;margin:0 0 8px;font-size:12px}.hero strong{font-size:25px;letter-spacing:.5px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat label{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:9px}.stat .blue{color:var(--cyan)}.stat .green{color:var(--green)}.stat .red{color:var(--red)}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 14px}.tabs button{white-space:nowrap;font-size:13px}.tabs button.active{border-color:var(--blue);background:#0879d825;color:var(--cyan)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}.sectionhead h2{font-size:17px;margin:0}.muted{color:var(--muted)}.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);outline:none;margin-bottom:12px}.list{display:grid;gap:9px}.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px}.thumb{width:55px;height:55px;flex-shrink:0;border-radius:10px;object-fit:cover;background:var(--panel2)}.iteminfo{flex:1;min-width:0}.iteminfo b{display:block;overflow-wrap:anywhere}.iteminfo small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.qty{font-weight:700;text-align:right;white-space:nowrap}.qty.low{color:var(--red)}.actions{display:flex;gap:6px;margin-top:8px}.actions button{padding:7px 9px;font-size:12px}.formbox{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}.formbox h3{margin:0 0 12px;font-size:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields .full{grid-column:1/-1}.fields label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.fields input,.fields select{width:100%;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.empty{text-align:center;color:var(--muted);padding:35px 10px}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center}.bottom button{flex:1;max-width:220px}.notice{padding:12px;border-radius:12px;background:#ffb02018;color:#ffc85a;margin-bottom:12px;font-size:13px}.historyrow{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.historyrow .detail{flex:1}.historyrow b{display:block}.historyrow small{color:var(--muted)}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="brand"><div class="logo">bp</div><div><h1>WAREHOUSE</h1><small>INVENTORY SYSTEM</small></div></div><div class="tools"><select id="lang" aria-label="Language" style="width:62px;padding:8px;border-radius:10px;background:var(--panel);color:var(--text);border:1px solid var(--line)"><option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option></select><button id="theme" title="Theme">☼</button></div></header>
<main><div id="authNotice" class="notice hidden">Bu demo rejimi. Serverga joylaganda faqat Telegram egasi IDsi orqali kirish yoqiladi.</div>
<section class="hero"><p id="welcome">OMBOR NAZORATI · LIVE</p><strong id="heroText">Har bir tovar — nazorat ostida.</strong></section>
<div class="stats"><div class="stat"><label id="lProducts">Jami tovarlar</label><b class="blue" id="sTotal">—</b></div><div class="stat"><label id="lLow">Kam qolgan</label><b class="red" id="sLow">—</b></div><div class="stat"><label id="lIn">Bugungi kirim</label><b class="green" id="sIn">—</b></div><div class="stat"><label id="lOut">Bugungi chiqim</label><b class="red" id="sOut">—</b></div></div>
<nav class="tabs"><button class="active" data-tab="products" id="tabProducts">📦 Tovarlar</button><button data-tab="add" id="tabAdd">＋ Tovar qo‘shish</button><button data-tab="movement" id="tabMove">↕ Kirim / Chiqim</button><button data-tab="history" id="tabHistory">◷ Tarix</button></nav>
<section id="productsPanel"><div class="sectionhead"><h2 id="productsTitle">Tovarlar</h2><button id="lowFilter">⚠ Kam qolgan</button></div><input id="search" class="search" placeholder="Tovar nomi, kodi, kategoriya bo‘yicha qidirish…"><div id="productList" class="list"></div><button id="more" class="hidden" style="width:100%;margin-top:12px">Yana yuklash</button></section>
<section id="addPanel" class="hidden"><div class="formbox"><h3 id="addTitle">Yangi tovar</h3><form id="addForm"><div class="fields"><div class="full"><label id="nameLabel">Tovar nomi *</label><input name="name" required placeholder="Masalan: Kabel 2.5 mm"></div><div><label id="skuLabel">Tovar kodi / SKU</label><input name="sku" placeholder="BP-0001"></div><div><label id="categoryLabel">Kategoriya</label><input name="category" placeholder="Elektr jihozlari"></div><div><label id="sourceLabel">Qayerdan keladi</label><input name="source" placeholder="Yetkazib beruvchi / mamlakat"></div><div><label id="qtyLabel">Boshlang‘ich miqdor</label><input name="quantity" type="number" min="0" step="any" value="0"></div><div><label id="minLabel">Kam qoldi chegarasi</label><input name="min_quantity" type="number" min="0" step="any" value="3"></div><div><label id="unitLabel">O‘lchov birligi</label><select name="unit"><option>dona</option><option>kg</option><option>metr</option><option>quti</option><option>litr</option><option>komplekt</option></select></div><div class="full"><label id="imageLabel">Tovar rasmi</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp"></div></div><button class="primary" type="submit" style="width:100%;margin-top:14px" id="saveProduct">Tovarni saqlash</button></form></div></section>
<section id="movementPanel" class="hidden"><div class="formbox"><h3 id="moveTitle">Kirim / Chiqim kiritish</h3><form id="moveForm"><div class="fields"><div class="full"><label id="chooseProductLabel">Tovar</label><select id="moveProduct" name="product_id" required></select></div><div><label id="kindLabel">Harakat turi</label><select name="kind"><option value="in" id="optIn">Kirim (+)</option><option value="out" id="optOut">Chiqim (−)</option></select></div><div><label id="moveQtyLabel">Miqdor</label><input name="quantity" type="number" min="0.001" step="any" required></div><div class="full"><label id="noteLabel">Izoh / hujjat raqami</label><input name="note" placeholder="Yetkazib beruvchi, nakladnoy..."></div></div><button class="primary" type="submit" style="width:100%;margin-top:14px" id="saveMove">Harakatni tasdiqlash</button></form></div></section>
<section id="historyPanel" class="hidden"><div class="sectionhead"><h2 id="historyTitle">Oxirgi harakatlar</h2><button id="refreshHistory">↻</button></div><div id="historyList"></div></section>
<div id="toast" class="hidden" style="position:fixed;left:15px;right:15px;bottom:88px;background:var(--panel2);border:1px solid var(--blue);border-radius:12px;padding:13px;z-index:5"></div>
</main><div class="bottom"><button id="quickIn">＋ Kirim</button><button id="quickOut">− Chiqim</button></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let initData=tg?.initData||"", allProducts=[], offset=0, lowOnly=false, selectedTab="products";
const $=id=>document.getElementById(id);
const dict={
uz:{welcome:"OMBOR NAZORATI · LIVE",hero:"Har bir tovar — nazorat ostida.",total:"Jami tovarlar",low:"Kam qolgan",incoming:"Bugungi kirim",outgoing:"Bugungi chiqim",products:"Tovarlar",add:"＋ Tovar qo‘shish",move:"↕ Kirim / Chiqim",history:"◷ Tarix",search:"Tovar nomi, kodi, kategoriya bo‘yicha qidirish…",addTitle:"Yangi tovar",name:"Tovar nomi *",sku:"Tovar kodi / SKU",category:"Kategoriya",source:"Qayerdan keladi",qty:"Boshlang‘ich miqdor",min:"Kam qoldi chegarasi",unit:"O‘lchov birligi",image:"Tovar rasmi",save:"Tovarni saqlash",moveTitle:"Kirim / Chiqim kiritish",choose:"Tovar",kind:"Harakat turi",in:"Kirim (+)",out:"Chiqim (−)",moveQty:"Miqdor",note:"Izoh / hujjat raqami",confirm:"Harakatni tasdiqlash",historyTitle:"Oxirgi harakatlar",lowBtn:"⚠ Kam qolgan",empty:"Tovar topilmadi",success:"Saqlandi!",error:"Xatolik",report:"Rasmli hisobot",loading:"Yuklanmoqda…",all:"Hammasi",need:"Kam qoldi",stock:"Qoldiq",date:"Sana",sourceLabel:"Manba"},
ru:{welcome:"КОНТРОЛЬ СКЛАДА · LIVE",hero:"Каждый товар под контролем.",total:"Всего товаров",low:"Мало осталось",incoming:"Приход сегодня",outgoing:"Расход сегодня",products:"Товары",add:"＋ Добавить товар",move:"↕ Приход / Расход",history:"◷ История",search:"Поиск по названию, коду, категории…",addTitle:"Новый товар",name:"Название товара *",sku:"Код / SKU",category:"Категория",source:"Источник поставки",qty:"Начальное количество",min:"Порог остатка",unit:"Единица измерения",image:"Фото товара",save:"Сохранить товар",moveTitle:"Оформить движение",choose:"Товар",kind:"Тип операции",in:"Приход (+)",out:"Расход (−)",moveQty:"Количество",note:"Примечание / документ",confirm:"Подтвердить",historyTitle:"Последние операции",lowBtn:"⚠ Мало осталось",empty:"Товары не найдены",success:"Сохранено!",error:"Ошибка",report:"Отчёт-картинка",loading:"Загрузка…",all:"Все",need:"Мало",stock:"Остаток",date:"Дата",sourceLabel:"Источник"},
en:{welcome:"INVENTORY CONTROL · LIVE",hero:"Every item, under control.",total:"Total products",low:"Low stock",incoming:"Today's inbound",outgoing:"Today's outbound",products:"Products",add:"＋ Add product",move:"↕ In / Out",history:"◷ History",search:"Search name, code, category…",addTitle:"New product",name:"Product name *",sku:"Product code / SKU",category:"Category",source:"Supply source",qty:"Opening quantity",min:"Low-stock threshold",unit:"Unit",image:"Product image",save:"Save product",moveTitle:"Record stock movement",choose:"Product",kind:"Movement type",in:"Stock in (+)",out:"Stock out (−)",moveQty:"Quantity",note:"Note / document number",confirm:"Confirm movement",historyTitle:"Recent movements",lowBtn:"⚠ Low stock",empty:"No products found",success:"Saved!",error:"Error",report:"Image report",loading:"Loading…",all:"All",need:"Low",stock:"Stock",date:"Date",sourceLabel:"Source"}};
let lang=localStorage.getItem("bp-lang")||"uz";$("lang").value=lang;
function tr(k){return dict[lang][k]||k}
function applyLang(){const map={welcome:"welcome",heroText:"hero",lProducts:"total",lLow:"low",lIn:"incoming",lOut:"outgoing",tabProducts:"products",tabAdd:"add",tabMove:"move",tabHistory:"history",productsTitle:"products",addTitle:"addTitle",nameLabel:"name",skuLabel:"sku",categoryLabel:"category",sourceLabel:"source",qtyLabel:"qty",minLabel:"min",unitLabel:"unit",imageLabel:"image",saveProduct:"save",moveTitle:"moveTitle",chooseProductLabel:"choose",kindLabel:"kind",optIn:"in",optOut:"out",moveQtyLabel:"moveQty",noteLabel:"note",saveMove:"confirm",historyTitle:"historyTitle",lowFilter:"lowBtn",search:"search"};for(const [id,k] of Object.entries(map)){if($(id)){if(id==="search")$(id).placeholder=tr(k);else $(id).textContent=tr(k)}}}
function headers(){return {"X-Telegram-Init-Data":initData}}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),...headers()};let r=await fetch(url,opts);let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||tr("error"));return data}
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3000)}
function imgSrc(p){return p.image||""}
function fmt(n){return Number(n||0).toLocaleString()}
async function loadSummary(){try{let s=await api("/api/summary");$("sTotal").textContent=fmt(s.total);$("sLow").textContent=fmt(s.low);$("sIn").textContent=fmt(s.incoming);$("sOut").textContent=fmt(s.outgoing)}catch(e){toast(e.message)}}
function productCard(p){let d=document.createElement("div");d.className="item";let im=document.createElement("img");im.className="thumb";im.src=imgSrc(p)||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="100%" height="100%" fill="#10243a"/><text x="50%" y="54%" text-anchor="middle" font-size="20" fill="#36c6ff">bp</text></svg>');let info=document.createElement("div");info.className="iteminfo";let b=document.createElement("b");b.textContent=p.name;let sm=document.createElement("small");sm.textContent=[p.sku||"SKU —",p.category||"Kategoriya —",p.source||""].filter(Boolean).join(" · ");info.append(b,sm);let acts=document.createElement("div");acts.className="actions";for(let [label,kind] of [["＋","in"],["−","out"]]){let bt=document.createElement("button");bt.textContent=label;bt.onclick=()=>{showTab("movement");$("moveProduct").value=p.id;$("moveForm").elements.kind.value=kind};acts.append(bt)}info.append(acts);let q=document.createElement("div");q.className="qty"+(Number(p.quantity)<=Number(p.min_quantity)?" low":"");q.textContent=fmt(p.quantity)+" "+p.unit;d.append(im,info,q);return d}
async function loadProducts(reset=true){if(reset){offset=0;$("productList").innerHTML="";allProducts=[]}let q=$("search").value.trim();try{let rows=await api(`/api/products?q=${encodeURIComponent(q)}&low_only=${lowOnly}&limit=100&offset=${offset}`);allProducts.push(...rows);rows.forEach(p=>$("productList").append(productCard(p)));offset+=rows.length;$("more").classList.toggle("hidden",rows.length<100);if(!allProducts.length)$("productList").innerHTML=`<div class="empty">${tr("empty")}</div>`;fillSelect()}catch(e){toast(e.message)}}
function fillSelect(){let s=$("moveProduct"),v=s.value;s.innerHTML="";allProducts.forEach(p=>{let o=document.createElement("option");o.value=p.id;o.textContent=`${p.name} · ${p.quantity} ${p.unit}`;s.append(o)});if(v)s.value=v}
async function loadHistory(){try{let rows=await api("/api/movements?limit=100");$("historyList").innerHTML="";rows.forEach(m=>{let el=document.createElement("div");el.className="historyrow";let im=document.createElement("img");im.className="thumb";im.src=m.image||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="100%" height="100%" fill="#10243a"/><text x="50%" y="54%" text-anchor="middle" font-size="20" fill="#36c6ff">bp</text></svg>');let detail=document.createElement("div");detail.className="detail";let b=document.createElement("b");b.textContent=(m.kind==="in"?"＋ ":"− ")+m.name;let sm=document.createElement("small");sm.textContent=`${m.quantity} ${m.unit} · ${m.created_at.slice(0,16).replace("T"," ")} · ${m.note||""}`;detail.append(b,sm);let bt=document.createElement("button");bt.textContent="PNG";bt.onclick=async()=>{try{let r=await fetch(`/api/report/${m.id}`,{headers:headers()});if(!r.ok)throw Error("Hisobot olinmadi");let blob=await r.blob(),url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download=`bp-report-${m.id}.png`;a.click();URL.revokeObjectURL(url)}catch(e){toast(e.message)}};el.append(im,detail,bt);$("historyList").append(el)})}catch(e){toast(e.message)}}
function showTab(t){selectedTab=t;["products","add","movement","history"].forEach(k=>$(k+"Panel").classList.toggle("hidden",k!==t));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));if(t==="products")loadProducts();if(t==="history")loadHistory();if(t==="movement"){if(!allProducts.length)loadProducts()}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$("quickIn").onclick=()=>{showTab("movement");$("moveForm").elements.kind.value="in"};$("quickOut").onclick=()=>{showTab("movement");$("moveForm").elements.kind.value="out"};
$("search").addEventListener("input",()=>{clearTimeout(window.st);window.st=setTimeout(()=>loadProducts(),220)});$("more").onclick=()=>loadProducts(false);$("lowFilter").onclick=()=>{lowOnly=!lowOnly;$("lowFilter").classList.toggle("active",lowOnly);loadProducts()};$("refreshHistory").onclick=loadHistory;
$("addForm").onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);try{await api("/api/products",{method:"POST",body:fd});e.target.reset();toast(tr("success"));loadSummary();showTab("products")}catch(err){toast(err.message)}};
$("moveForm").onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);try{let r=await api("/api/movement",{method:"POST",body:fd});toast(tr("success")+" · "+r.name);loadSummary();loadProducts();let ask=confirm("Kirim uchun rasmli hisobotni olishni xohlaysizmi?");if(ask){let resp=await fetch(`/api/report/${r.movement_id}`,{headers:headers()});let blob=await resp.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`bp-report-${r.movement_id}.png`;a.click();URL.revokeObjectURL(url)}e.target.elements.quantity.value="";}catch(err){toast(err.message)}};
$("lang").onchange=()=>{lang=$("lang").value;localStorage.setItem("bp-lang",lang);applyLang();loadProducts()};$("theme").onclick=()=>{document.body.classList.toggle("light");localStorage.setItem("bp-theme",document.body.classList.contains("light")?"light":"dark")};if(localStorage.getItem("bp-theme")==="light")document.body.classList.add("light");
if(!initData){$("authNotice").classList.remove("hidden");if(!location.hostname.includes("localhost")){}}
applyLang();loadSummary();loadProducts();
</script></body></html>
